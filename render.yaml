services:
  # FastAPI Backend Web Service
  - type: web
    name: careerlens-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: PROJECT_NAME
        value: "CareerLens AI"
      - key: API_V1_STR
        value: "/api/v1"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: careerlens-db
          property: connectionString
      - key: BACKEND_CORS_ORIGINS
        value: "*"

databases:
  # PostgreSQL Database Instance
  - name: careerlens-db
    databaseName: careerlens_db
    user: careerlens
    region: oregon
    plan: free
