workflows:
  ios-workflow:
    name: iOS Build (CareerLens AI)
    max_build_duration: 60
    instance_type: mac_mini_m1
    working_directory: mobile
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter dependencies
        script: |
          flutter pub get
      - name: Build iOS Application Package (.ipa)
        script: |
          flutter build ipa --release --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/iphoneos/*.app

  android-workflow:
    name: Android APK Build (CareerLens AI)
    max_build_duration: 30
    instance_type: mac_mini_m1
    working_directory: mobile
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter dependencies
        script: |
          flutter pub get
      - name: Build Release APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
