version: '3.8'

services:
  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: careerlens_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-careerlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careerlens_pass}
      POSTGRES_DB: ${POSTGRES_DB:-careerlens_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres_init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-careerlens} -d ${POSTGRES_DB:-careerlens_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careerlens_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=CareerLens AI
      - ENVIRONMENT=production
      - DEBUG=False
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-careerlens}:${POSTGRES_PASSWORD:-careerlens_pass}@postgres:5432/${POSTGRES_DB:-careerlens_db}
      - JWT_SECRET=${JWT_SECRET:-careerlens_ai_super_secret_jwt_key_change_in_production_32chars_min}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
